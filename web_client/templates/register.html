{% extends "user_base.html" %}
{% block title %}邮箱注册 · {{ portal_name }}{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card register-card">
  <div class="eyebrow">EMAIL REGISTRATION</div>
  <h1>创建客户账号</h1>
  <p class="muted">注册账号后，用群授权卡密绑定群聊。</p>
  <form method="post" action="/user/register" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>邮箱地址<input type="email" name="email" value="{{ registration_email }}" autocomplete="email" maxlength="320" required></label>
    <div class="verification-row"><label>邮箱验证码<input name="email_code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label><button class="button secondary" type="submit" formaction="/user/register/code" formnovalidate>获取验证码</button></div>
    <label>账号<input name="username" autocomplete="username" minlength="4" maxlength="32" pattern="[A-Za-z0-9_]+" required></label>
    <div class="form-grid two">
      <label>密码<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>确认密码<input type="password" name="password_confirm" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    </div>
    <button class="button primary wide" type="submit">验证邮箱并注册</button>
  </form>
  <p class="auth-switch">已有账号？<a href="/user/login">返回登录</a></p>
</section>
{% endblock %}

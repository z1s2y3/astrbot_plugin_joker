{% extends "user_base.html" %}
{% block title %}找回密码 · {{ portal_name }}{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card register-card">
  <div class="eyebrow">PASSWORD RECOVERY</div>
  <h1>邮箱找回密码</h1>
  <p class="muted">输入注册时绑定的邮箱获取验证码，验证后即可设置新密码。旧账号未绑定邮箱时，请联系管理员重置。</p>
  <form method="post" action="/user/forgot-password" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>注册邮箱<input type="email" name="email" value="{{ reset_email }}" autocomplete="email" maxlength="320" required></label>
    <div class="verification-row"><label>邮箱验证码<input name="email_code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label><button class="button secondary" type="submit" formaction="/user/forgot-password/code" formnovalidate>获取验证码</button></div>
    <div class="form-grid two">
      <label>新密码<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>确认新密码<input type="password" name="password_confirm" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    </div>
    <button class="button primary wide" type="submit">验证并重置密码</button>
  </form>
  <p class="auth-switch"><a href="/user/login">返回登录</a></p>
</section>
{% endblock %}

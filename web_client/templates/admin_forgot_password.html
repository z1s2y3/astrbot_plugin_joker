{% extends "admin_base.html" %}
{% block title %}找回管理员密码 · {{ portal_name }}{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card register-card">
  <div class="eyebrow">ADMIN PASSWORD RECOVERY</div>
  <h1>找回管理员密码</h1>
  <p class="muted">验证码只可重置管理员账号。客户账号请使用客户中心的找回入口。</p>
  <form method="post" action="/admin/forgot-password" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>管理员注册邮箱<input type="email" name="email" value="{{ reset_email }}" autocomplete="email" maxlength="320" required></label>
    <div class="verification-row"><label>邮箱验证码<input name="email_code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label><button class="button secondary" type="submit" formaction="/admin/forgot-password/code" formnovalidate>获取验证码</button></div>
    <div class="form-grid two">
      <label>新密码<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>确认新密码<input type="password" name="password_confirm" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    </div>
    <button class="button primary wide" type="submit">验证并重置密码</button>
  </form>
  <p class="auth-switch"><a href="/admin/login">返回管理员登录</a></p>
</section>
{% endblock %}
